name: M19UIT
options:
  bundleIdPrefix: com.malikkaraoui
  deploymentTarget:
    iOS: "17.0"
targets:
  BoitesALivresNative:
    type: application
    platform: iOS
    sources:
      - path: /Users/malik/Documents/Boites-a-livres/BoitesALivresNative/.claude/worktrees/F03-M0019/BoitesALivresNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malikkaraoui.boitesalivresapp
        INFOPLIST_FILE: /Users/malik/Documents/Boites-a-livres/BoitesALivresNative/.claude/worktrees/F03-M0019/BoitesALivresNative/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 10
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  M19UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BoitesALivresNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
        TEST_TARGET_NAME: BoitesALivresNative
schemes:
  M19:
    build:
      targets:
        BoitesALivresNative: all
        M19UITests: [test]
    test:
      targets: [M19UITests]
